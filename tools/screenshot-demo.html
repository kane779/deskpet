<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>DeskPet 界面演示（截图用）</title>
  <link rel="stylesheet" href="../src/renderer/styles.css" />
  <style>
    /* 仅截图用的"桌面背景"，让深色面板有衬托 */
    html, body {
      background: #e9ebf1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 放大 2 倍，配合 720x1096 的窗口尺寸拿到高清截图 */
    html {
      zoom: 2;
    }
    .shell {
      width: 336px;
      height: 524px;
      box-shadow: 0 10px 34px rgba(24, 32, 60, 0.20);
    }
  </style>
  <script>
    /* 假的桥接层：让界面在没有 Electron 的情况下也能渲染出示例数据 */
    var mockData = {
      settings: {
        launchAtLogin: true,
        clipboardEnabled: true,
        clipboardLimit: 200,
        ballVisible: true,
        shortcut: 'CommandOrControl+Shift+V'
      },
      memos: [
        { id: 'm1', name: '工作', createdAt: Date.now() - 86400000 },
        { id: 'm2', name: '购物', createdAt: Date.now() - 3600000 }
      ],
      todos: [
        { id: 't1', memoId: 'm1', text: '把项目文档整理好发给组长', done: false, createdAt: Date.now() - 7200000, doneAt: null, dueAt: Date.now() + 5400000, notified: false },
        { id: 't2', memoId: 'm1', text: '准备周三的汇报材料', done: false, createdAt: Date.now() - 3600000, doneAt: null, dueAt: null, notified: false },
        { id: 't3', memoId: 'm1', text: '回复客户的邮件', done: false, createdAt: Date.now() - 1800000, doneAt: null, dueAt: null, notified: false },
        { id: 't4', memoId: 'm1', text: '提交上周的周报', done: true, createdAt: Date.now() - 172800000, doneAt: Date.now() - 5400000, dueAt: null, notified: false },
        { id: 't5', memoId: 'm2', text: '买咖啡豆', done: false, createdAt: Date.now() - 900000, doneAt: null, dueAt: null, notified: false }
      ],
      clips: [
        { id: 'c1', text: '今天的会议结论：下周一之前交一版原型，周三集体评审。', createdAt: Date.now() - 40000, pinned: false },
        { id: 'c2', text: 'https://github.com/wukane/deskpet', createdAt: Date.now() - 260000, pinned: true },
        { id: 'c3', text: '13800138000', createdAt: Date.now() - 900000, pinned: false },
        { id: 'c4', text: '物流单号 SF1234567890123，预计明天下午送达，记得当面签收。', createdAt: Date.now() - 3600000, pinned: false },
        { id: 'c5', text: "SELECT * FROM users WHERE created_at > '2026-01-01';", createdAt: Date.now() - 7200000, pinned: false }
      ]
    };

    var noop = function () {
      return Promise.resolve({ ok: true, data: mockData });
    };

    window.deskpet = {
      loadAll: function () { return Promise.resolve({ ok: true, data: mockData }); },
      getInfo: function () {
        return Promise.resolve({
          ok: true,
          data: mockData,
          info: {
            version: '1.0.0',
            platform: 'win32',
            dataFile: 'C:\\Users\\你的用户名\\AppData\\Roaming\\DeskPet\\data.json',
            shortcut: 'CommandOrControl+Shift+V',
            clipboardRunning: true
          }
        });
      },
      addTodo: noop, toggleTodo: noop, updateTodo: noop, removeTodo: noop, clearDoneTodos: noop,
      addMemo: noop, renameMemo: noop, removeMemo: noop,
      copyClip: function () { return Promise.resolve({ ok: true, copied: true, data: mockData }); },
      removeClip: noop, togglePin: noop, clearClips: noop, addClipManually: noop,
      updateSettings: function () { return Promise.resolve({ ok: true, data: mockData }); },
      exportData: function () { return Promise.resolve({ ok: true, data: mockData, dir: 'D:\\Documents\\DeskPet导出' }); },
      openDataFolder: noop, openExternal: noop, hideWindow: noop, quitApp: noop,
      getBallPosition: function () { return Promise.resolve({ ok: true, x: 0, y: 0, data: mockData }); },
      moveBall: noop, togglePanel: noop, hideBall: noop,
      onDataChanged: function () {}, onSwitchTab: function () {}, onToast: function () {}
    };
  </script>
</head>
<body>
  <div class="shell">

    <header class="titlebar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">DeskPet</span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="icon-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <circle cx="8" cy="8" r="2.4" />
            <path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" />
          </svg>
        </button>
        <button type="button" class="icon-btn" id="btn-hide" title="收起到托盘">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M3.5 8h9" />
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs">
      <button type="button" class="tab is-active" data-tab="todo">待办</button>
      <button type="button" class="tab" data-tab="clip">剪贴板</button>
    </nav>

    <main class="content">

      <section class="page is-active" id="page-todo">
        <div class="row">
          <select id="memo-select" class="select" title="切换备忘录"></select>
          <button type="button" class="btn btn-ghost btn-square" id="btn-memo-menu" title="备忘录操作">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor">
              <circle cx="3.4" cy="8" r="1.3" /><circle cx="8" cy="8" r="1.3" /><circle cx="12.6" cy="8" r="1.3" />
            </svg>
          </button>
        </div>

        <form class="add-form" id="todo-form">
          <input type="text" id="todo-input" class="input" placeholder="要做什么？按回车添加" autocomplete="off" maxlength="500" />
          <div class="add-form-foot">
            <input type="datetime-local" id="todo-due" class="input input-due" title="给这条待办设个截止时间，到点会弹系统通知（可选）" />
            <button type="submit" class="btn btn-primary">添加</button>
          </div>
        </form>

        <div class="row">
          <button type="button" class="chip is-active" data-filter="active">进行中</button>
          <button type="button" class="chip" data-filter="done">已完成</button>
          <button type="button" class="chip" data-filter="all">全部</button>
          <span class="spacer"></span>
          <span class="counter" id="todo-counter"></span>
        </div>

        <ul class="list" id="todo-list"></ul>
      </section>

      <section class="page" id="page-clip">
        <div class="row">
          <input type="text" id="clip-search" class="input" placeholder="搜索复制过的内容" autocomplete="off" />
        </div>
        <div class="row">
          <label class="switch">
            <input type="checkbox" id="clip-enabled" />
            <span class="switch-track"><span class="switch-knob"></span></span>
            <span class="switch-text">自动记录</span>
          </label>
          <span class="spacer"></span>
          <span class="counter" id="clip-counter"></span>
          <button type="button" class="btn btn-ghost btn-danger" id="btn-clear-clip">清空</button>
        </div>
        <ul class="list" id="clip-list"></ul>
      </section>

    </main>

    <footer class="statusbar">
      <span id="status-text"></span>
      <span id="status-hint"></span>
    </footer>

    <div class="popmenu" id="memo-menu" hidden>
      <button type="button" data-action="create">新建待办</button>
      <button type="button" data-action="rename">重命名当前</button>
      <button type="button" data-action="delete">删除当前</button>
    </div>

    <div class="sheet" id="settings-sheet" hidden>
      <div class="sheet-head">
        <span>设置</span>
        <button type="button" class="icon-btn" id="btn-close-settings" title="关闭">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />
          </svg>
        </button>
      </div>

      <div class="sheet-body">
        <div class="field">
          <span class="field-label">显示桌面悬浮球</span>
          <label class="switch">
            <input type="checkbox" id="set-ball" />
            <span class="switch-track"><span class="switch-knob"></span></span>
          </label>
        </div>

        <div class="field">
          <span class="field-label">开机自动启动</span>
          <label class="switch">
            <input type="checkbox" id="set-autostart" />
            <span class="switch-track"><span class="switch-knob"></span></span>
          </label>
        </div>

        <div class="field">
          <span class="field-label">剪贴板最多保留</span>
          <span class="field-control">
            <input type="number" id="set-limit" class="input input-num" min="20" max="2000" step="10" />
            <span class="unit">条</span>
          </span>
        </div>

        <div class="field field-stack">
          <span class="field-label">全局快捷键</span>
          <input type="text" id="set-shortcut" class="input" readonly placeholder="点这里后按组合键" />
          <span class="hint">点一下上面的框，然后直接按你想用的组合键，比如 Ctrl+Shift+V。按下去就会自动记录。</span>
        </div>

        <div class="field field-stack">
          <span class="field-label">数据存放位置</span>
          <span class="path" id="set-datapath">读取中…</span>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn btn-ghost" id="btn-open-folder">打开数据文件夹</button>
          <button type="button" class="btn btn-primary" id="btn-export">导出备份</button>
        </div>

        <div class="sheet-actions">
          <span class="version" id="set-version"></span>
        </div>

        <div class="sheet-actions">
          <button type="button" class="btn btn-ghost btn-danger" id="btn-quit">完全退出 DeskPet</button>
        </div>
      </div>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-box">
        <p class="modal-title" id="modal-title"></p>
        <p class="modal-text" id="modal-text"></p>
        <input type="text" class="input" id="modal-input" autocomplete="off" maxlength="60" />
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="modal-ok">确定</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

  </div>

  <script src="../src/renderer/renderer.js"></script>
  <script>
    /* 按地址栏 hash 自动切到指定画面，方便批量截图 */
    setTimeout(function () {
      var view = (location.hash || '').replace('#', '');
      if (view === 'clip') {
        var tab = document.querySelector('.tab[data-tab="clip"]');
        if (tab) tab.click();
        var search = document.getElementById('clip-search');
        if (search) search.blur();
      } else if (view === 'settings') {
        var gear = document.getElementById('btn-settings');
        if (gear) gear.click();
      }
    }, 700);
  </script>
</body>
</html>
