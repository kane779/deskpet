name: 自动打包

# 什么时候会触发：
#   1. 把代码推送到 main 分支            → 打包，产出可下载的 Artifacts
#   2. 推送一个以 v 开头的标签（如 v1.0.0）→ 打包，并自动创建 Release 供别人下载
#   3. 在仓库的 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 默认只读权限，需要写权限的任务会单独声明（更安全）
permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: DeskPet-Windows
          - os: macos-latest
            label: macOS
            artifact: DeskPet-macOS

    steps:
      - name: 取出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 让安装包版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # electron-builder 是用 package.json 里的 version 来给安装包命名的，
          # 而发布页用的是 git 标签。两者不一致时（发布页叫 v1.0.1、包里却写着 1.0.0）
          # 会让人困惑，所以这里把 package.json 的 version 同步成标签号
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.TAG_NAME.replace(/^v/,'');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+String.fromCharCode(10));console.log('package.json version ->',p.version);"

      - name: 打包成安装包
        run: npx electron-builder --publish never
        env:
          # 没有苹果开发者证书，跳过签名，生成未签名的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传安装包
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn

  # 只有推送 v 开头的标签时才跑这里。
  # 作用：把两个平台的安装包汇总成一个 Release，这样别人不用登录 GitHub
  # 就能直接下载（Artifacts 是必须登录才能下的，不方便分享）。
  release:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载两个平台的安装包
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个任务没有检出代码，显式告诉 gh 操作哪个仓库
          GH_REPO: ${{ github.repository }}
        run: |
          echo "tag = $GITHUB_REF_NAME     repo = $GITHUB_REPOSITORY"
          echo "--- 下载到的文件 ---"
          ls -la dist || echo "(dist 不存在)"

          # 递归查找所有安装包，用数组收集（避免文件名里的空格被拆开）
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find dist -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::dist 里没有找到任何 .exe / .dmg 文件"
            ls -laR dist || true
            exit 1
          fi
          echo "共找到 ${#FILES[@]} 个安装包："
          printf '  %s\n' "${FILES[@]}"

          # 如果你已经在网页上手动建过这个版本的 Release，就直接补传安装包；
          # 没建过则自动创建。两种操作方式都不会冲突。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! OUT=$(gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber 2>&1); then
              echo "::error::gh release upload 失败：$(printf '%s' "$OUT" | tr '\n' ' ')"
              exit 1
            fi
          else
            if ! OUT=$(gh release create "$GITHUB_REF_NAME" --title "DeskPet $GITHUB_REF_NAME" --notes "下载对应你系统的安装包即可使用：Windows 用 .exe，macOS 用 .dmg。" "${FILES[@]}" 2>&1); then
              echo "::error::gh release create 失败：$(printf '%s' "$OUT" | tr '\n' ' ')"
              exit 1
            fi
          fi
          echo "发布完成"
